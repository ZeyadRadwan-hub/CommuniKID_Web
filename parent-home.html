<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية | CommuniKID</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

    <div class="global-controls">
        <button id="themeToggle" class="control-btn">🌙</button>
        <button id="langToggle" class="control-btn">EN</button>
    </div>

    <header class="app-navbar">
        <div class="user-info">
            <div class="avatar-circle">👦</div>
            <div>
                <h3 id="heroName">أهلاً يا بطل!</h3>
                <p class="points-badge">⭐ <span id="heroPoints">0</span> <span data-i18n="points">نقطة</span></p>
            </div>
        </div>
        
        <div class="nav-actions">
            <button id="openAddWordModal" class="action-btn" style="background-color: var(--primary-color); color: white;" data-i18n="add_word">➕ إضافة كلمة</button>
            <a href="market.html" class="action-btn" style="text-decoration: none; background-color: #f1c40f; color: #333;" data-i18n="market">🛒 الماركت</a>
            <a href="progress.html" class="action-btn" style="text-decoration: none; background-color: #8e44ad; color: white;" data-i18n="reports">📈 التقارير</a>
            <a href="settings.html" class="action-btn" style="text-decoration: none; background-color: var(--secondary-color); color: white;" data-i18n="settings">⚙️ الإعدادات</a>
            <button id="logoutBtn" class="danger-btn" data-i18n="logout">تسجيل الخروج 🚪</button>
        </div>
    </header>

    <main class="main-content">
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; max-width: 1000px; margin-left: auto; margin-right: auto;">
            <a href="parent-tasks.html" class="action-btn" style="text-decoration: none; background-color: #2ecc71; color: white; padding: 12px 25px; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">المهام والواجبات 🎯</a>
            <a href="parent-appointments.html" class="action-btn" style="text-decoration: none; background-color: #f39c12; color: white; padding: 12px 25px; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">مواعيد الجلسات 📅</a>
            <a href="parent-chat.html" class="action-btn" style="text-decoration: none; background-color: #3498db; color: white; padding: 12px 25px; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">رسائل الأخصائي 💬</a>
        </div>

        <section class="sentence-builder">
            <div class="sentence-box" id="sentenceBox">
                <p class="placeholder-text" id="sentencePlaceholder" data-i18n="sentence_placeholder">اضغط على الكروت لتكوين جملة...</p>
            </div>
            <div class="sentence-actions">
                <button class="action-btn play-btn" id="playSentenceBtn" data-i18n="play_btn">🔊 انطق الجملة</button>
                <button class="action-btn mic-btn" id="micSentenceBtn" data-i18n="mic_btn">🎤 جرب بصوتك</button>
                <button class="action-btn clear-btn" id="clearSentenceBtn" data-i18n="clear_btn">🗑️ مسح</button>
            </div>
        </section>

        <section class="categories-section">
            <h2 class="section-title" id="sectionTitle" data-i18n="hero_title">اختار التصنيف 📚</h2>
            <div class="categories-grid" id="categoriesGrid"></div>
        </section>
    </main>

    <div id="addWordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 data-i18n="add_word">إضافة كلمة جديدة ✨</h2>
            <form id="addWordForm">
                <div class="input-group">
                    <label>التصنيف</label>
                    <select id="wordCategory" required>
                        <option value="animals">حيوانات</option>
                        <option value="food">أكل وشرب</option>
                        <option value="actions">أفعال</option>
                        <option value="feelings">مشاعر</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>الكلمة (عربي)</label>
                    <input type="text" id="wordAr" required placeholder="مثال: سيارة">
                </div>
                <div class="input-group">
                    <label>الكلمة (إنجليزي)</label>
                    <input type="text" id="wordEn" required placeholder="مثال: Car">
                </div>
                <div class="input-group">
                    <label>رابط الصورة</label>
                    <input type="url" id="wordImage" required placeholder="مثال: https://images.unsplash.com/...">
                </div>
                <button type="submit" class="primary-btn">حفظ الكلمة في النظام</button>
            </form>
        </div>
    </div>

    <script src="js/global.js"></script>
    <script src="js/data.js"></script> 
    <script src="js/sentence.js"></script> 
    <script src="js/parent.js"></script>
</body>
</html>
