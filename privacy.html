<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخصوصية والأمان | CommuniKID</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body settings-page">
    <div class="global-controls"><button id="themeToggle" class="control-btn">🌙</button><button id="langToggle" class="control-btn">EN</button></div>
    <header class="settings-header" style="margin-top: 40px; max-width: 600px; margin-left: auto; margin-right: auto;">
        <h1>الخصوصية والأمان 🛡️<br><span style="font-size: 0.9rem; font-weight: normal; opacity: 0.7;">تغيير كلمة المرور</span></h1>
        <a href="settings.html" class="control-btn" style="text-decoration: none;">⬅️ رجوع</a>
    </header>
    <div class="auth-container" style="margin: 0 auto;">
        <div class="auth-box">
            <form id="privacyForm">
                <div class="input-group"><label>كلمة المرور الحالية</label><input type="password" id="currentPass" required></div>
                <div class="input-group"><label>كلمة المرور الجديدة</label><input type="password" id="newPass" required></div>
                <div class="input-group"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="confirmPass" required></div>
                <button type="submit" class="primary-btn">تحديث كلمة المرور 🔒</button>
            </form>
        </div>
    </div>
    <script src="js/global.js"></script><script src="js/privacy.js"></script>
</body>
</html>
