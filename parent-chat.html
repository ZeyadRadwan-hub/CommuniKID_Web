<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسائل الأخصائي | CommuniKID</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/therapist-chat.css"> <!-- نستخدم نفس التنسيق -->
</head>
<body class="app-body">

    <div class="global-controls">
        <button id="themeToggle" class="control-btn">🌙</button>
        <button id="langToggle" class="control-btn">EN</button>
    </div>

    <header class="app-navbar" style="max-width: 900px; margin: 40px auto 20px;">
        <a href="parent-home.html" class="action-btn clear-btn" style="text-decoration: none;">⬅️ رجوع للرئيسية</a>
        <h2 style="color: var(--secondary-color);">التواصل مع الأخصائي 💬</h2>
    </header>

    <main class="chat-layout" style="max-width: 900px;">
        <!-- منطقة الشات -->
        <section class="chat-main" style="border-radius: 20px;">
            <div id="chatHeader" class="chat-header">
                <h3 id="activeContactName">جاري تحميل المحادثة...</h3>
            </div>
            
            <div id="chatMessages" class="chat-messages">
                <!-- الرسائل هنا -->
            </div>

            <form id="chatInputForm" class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك للأخصائي هنا..." required>
                <button type="submit" class="send-btn">إرسال 🚀</button>
            </form>
        </section>
    </main>

    <script src="js/global.js"></script>
    <script src="js/parent-chat.js"></script>
</body>
</html>
